<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bastion Blitz - Jeu de défense de château</title>
<meta name="description" content="Bastion Blitz : pilote ton château roulant, tire sur les vagues de monstres, ramasse des pièces et améliore ton arsenal. Jeu gratuit en ligne.">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#12172b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;align-items:center}
  .ad{display:none;width:100%;text-align:center;min-height:50px;flex:none;background:#0d1122}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
  #wrap{position:relative;touch-action:none}
  canvas{width:100%;height:100%;display:block;border-radius:10px}
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.5em;padding:.8em;background:rgba(14,18,40,.86);border-radius:10px;overflow:auto;text-align:center}
  #ov h1{margin:0;font-size:2.1em;letter-spacing:.04em;color:#ffcf4a;text-shadow:0 3px 0 #a5521a}
  #ov h2{margin:0;font-size:1.5em;color:#ffcf4a}
  #ov p{margin:.1em 0;opacity:.92;font-size:.95em}
  #ov .g{font-weight:700;font-size:1.2em;color:#ffd75e}
  .ups{display:grid;grid-template-columns:1fr 1fr;gap:.5em;width:100%;max-width:300px}
  button{font:inherit;color:#fff;border:0;cursor:pointer}
  .up{background:#2c3a6b;border-radius:10px;padding:.55em .4em;display:flex;flex-direction:column;gap:.15em;font-size:.9em}
  .up span{color:#ffd75e;font-weight:700}
  .up:disabled{opacity:.45;cursor:default}
  .main{background:linear-gradient(#4fd35f,#2a9a3b);border-radius:14px;padding:.7em 1.6em;font-weight:800;font-size:1.15em;box-shadow:0 4px 0 #1b6b28;margin-top:.3em}
  .sec{background:#3a4a85;border-radius:12px;padding:.5em 1.2em;font-weight:600}
  #mute{position:absolute;top:6px;right:6px;width:2.1em;height:2.1em;border-radius:50%;background:rgba(0,0,0,.35);font-size:1em;z-index:3}
</style>
</head>
<body>
<div id="app">
  <div class="ad" id="adTop"></div>
  <div id="stage">
    <div id="wrap">
      <canvas id="c"></canvas>
      <button id="mute" aria-label="Son">🔊</button>
      <div id="ov"></div>
    </div>
  </div>
  <div class="ad" id="adBot"></div>
</div>

<script>
/* ============ CONFIG ADSENSE ============
   1) Renseigne ton ID éditeur (ex: "ca-pub-1234567890123456")
   2) Crée 2 blocs d'annonces "bannière 320x50" dans AdSense et colle leurs ID de bloc.
   Tant que ADS.client est vide, aucune pub n'est chargée. */
const ADS = { client: "", slotTop: "", slotBottom: "" };

function initAds(){
  if(!ADS.client) return;
  const s=document.createElement("script");
  s.async=true; s.crossOrigin="anonymous";
  s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+ADS.client;
  document.head.appendChild(s);
  [["adTop",ADS.slotTop],["adBot",ADS.slotBottom]].forEach(([id,slot])=>{
    if(!slot) return;
    const el=document.getElementById(id);
    el.style.display="block";
    el.innerHTML='<ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="'+ADS.client+'" data-ad-slot="'+slot+'"></ins>';
    (window.adsbygoogle=window.adsbygoogle||[]).push({});
  });
  setTimeout(resize,300);
}

/* ============ JEU ============ */
const W=360,H=640,WALL=592;
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const wrap=document.getElementById("wrap"),stage=document.getElementById("stage"),ov=document.getElementById("ov");
cv.width=W*2;cv.height=H*2;ctx.scale(2,2);

function resize(){
  const s=Math.min(stage.clientWidth/W,stage.clientHeight/H);
  wrap.style.width=(W*s)+"px";wrap.style.height=(H*s)+"px";
  wrap.style.fontSize=(16*Math.max(.72,s))+"px";
}
addEventListener("resize",resize);

/* sauvegarde */
const SAVE_KEY="bastionblitz_v1";
let save={gold:0,dmg:0,rate:0,hp:0,multi:0,best:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||"{}"));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* son */
let AC,muted=false;
function beep(f,d,type,v){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"square";o.frequency.value=f;g.gain.value=v||.04;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);
  }catch(e){}
}
document.getElementById("mute").onclick=e=>{muted=!muted;e.target.textContent=muted?"🔇":"🔊";};

/* améliorations */
const UP=[
  {k:"dmg",n:"💥 Dégâts",base:20,max:30,m:1.4},
  {k:"rate",n:"⚡ Cadence",base:25,max:25,m:1.4},
  {k:"hp",n:"❤️ Solidité",base:30,max:20,m:1.45},
  {k:"multi",n:"🔫 Canons",base:80,max:4,m:2.3}
];
const cost=u=>Math.round(u.base*Math.pow(u.m,save[u.k]));
const maxHp=()=>5+save.hp;
const dmgVal=()=>1+save.dmg*.5;
const interval=()=>Math.max(.09,.42*Math.pow(.93,save.rate))/(p.rapid>0?1.8:1);

/* ennemis */
const T={
  grunt:{r:15,hp:3,sp:42,c:"#5fcf6a",sc:10,coin:1},
  fast:{r:11,hp:2,sp:85,c:"#ffb040",sc:15,coin:1},
  brute:{r:21,hp:11,sp:28,c:"#a070e0",sc:40,coin:3},
  boss:{r:40,hp:140,sp:16,c:"#e04a5a",sc:500,coin:25}
};

let state="menu",wave=1,score=0,t=0,tx=W/2,shake=0,banner=null,queue=[],spawnT=0,spawnInt=1,hpMul=1;
let p={x:W/2,y:548,hp:5,cd:0,hurt:0,rapid:0};
let bullets=[],enemies=[],coins=[],parts=[],picks=[];
const grass=[];for(let i=0;i<60;i++)grass.push([Math.random()*W,Math.random()*WALL,Math.random()*6+4]);

function startWave(){
  const n=6+wave*3;queue=[];
  for(let i=0;i<n;i++){
    const r=Math.random();
    queue.push(wave>=3&&r<.18?"brute":wave>=2&&r<.45?"fast":"grunt");
  }
  if(wave%5===0)queue.splice(Math.floor(queue.length/2),0,"boss");
  spawnInt=Math.max(.35,1.1-wave*.05);spawnT=.8;
  hpMul=1+(wave-1)*.22;
  banner={t:2,txt:wave%5===0?"⚠ BOSS - Vague "+wave:"Vague "+wave};
}
function initRun(){
  wave=1;score=0;
  p={x:W/2,y:548,hp:maxHp(),cd:0,hurt:0,rapid:0};
  bullets=[];enemies=[];coins=[];parts=[];picks=[];tx=W/2;
  startWave();state="play";hideOv();
}
function hideOv(){ov.style.display="none";}

function spawn(type){
  const d=T[type];
  const hp=d.hp*hpMul*(type==="boss"?(1+wave*.12):1);
  enemies.push({t:type,x:30+Math.random()*(W-60),y:-d.r-10,r:d.r,hp,max:hp,sp:d.sp*(1+wave*.01),hit:0,ph:Math.random()*6,bx:0});
  enemies[enemies.length-1].bx=enemies[enemies.length-1].x;
}
function shoot(){
  const n=1+save.multi;
  for(let i=0;i<n;i++){
    const o=i-(n-1)/2,a=o*.13;
    bullets.push({x:p.x+o*10,y:p.y-34,vx:Math.sin(a)*520,vy:-Math.cos(a)*520,d:dmgVal()});
  }
  beep(520,.04,"square",.012);
}
function hurt(n){
  if(state!=="play")return;
  p.hp-=n;p.hurt=.7;shake=.3;beep(110,.25,"sawtooth",.06);
  if(p.hp<=0){gameOver();}
}
function puff(x,y,c,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.3,c});}
}
function kill(e,i){
  const d=T[e.t];
  enemies.splice(i,1);score+=d.sc;
  puff(e.x,e.y,d.c,e.t==="boss"?40:10);
  for(let k=0;k<d.coin;k++)coins.push({x:e.x+(Math.random()-.5)*e.r*1.5,y:e.y+(Math.random()-.5)*e.r,v:e.t==="boss"?3:1,vy:30+Math.random()*30});
  if(Math.random()<(e.t==="boss"?1:.07))picks.push({x:e.x,y:e.y,k:Math.random()<.5?"R":"H"});
  beep(e.t==="boss"?90:260,.12,"triangle",.05);
  if(e.t==="boss")shake=.6;
}

function update(dt){
  if(keys.l)tx-=320*dt;if(keys.r)tx+=320*dt;
  tx=Math.max(34,Math.min(W-34,tx));
  p.x+=(tx-p.x)*Math.min(1,dt*14);
  p.hurt=Math.max(0,p.hurt-dt);p.rapid=Math.max(0,p.rapid-dt);shake=Math.max(0,shake-dt);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}

  p.cd-=dt;if(p.cd<=0){shoot();p.cd=interval();}

  spawnT-=dt;
  if(queue.length&&spawnT<=0){spawn(queue.shift());spawnT=spawnInt;}

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    for(let j=0;j<enemies.length;j++){
      const e=enemies[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){
        e.hp-=b.d;e.hit=.08;bullets.splice(i,1);
        if(e.hp<=0)kill(e,j);
        break;
      }
    }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.y+=e.sp*dt;e.hit=Math.max(0,e.hit-dt);
    if(e.t==="fast")e.x=e.bx+Math.sin(t*3+e.ph)*40;
    if(e.y+e.r>=WALL+8){
      enemies.splice(i,1);puff(e.x,WALL,"#fff",8);
      hurt(e.t==="boss"?5:e.t==="brute"?2:1);
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.y+=c.vy*dt;
    const d=Math.hypot(p.x-c.x,p.y-c.y);
    if(d<110){c.x+=(p.x-c.x)*dt*6;c.y+=(p.y-c.y)*dt*6;}
    if(d<30){save.gold+=c.v;coins.splice(i,1);beep(900,.05,"sine",.03);continue;}
    if(c.y>H+10)coins.splice(i,1);
  }
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i];k.y+=50*dt;
    if(Math.hypot(p.x-k.x,p.y-k.y)<34){
      if(k.k==="R"){p.rapid=7;banner={t:1.2,txt:"⚡ Tir rapide !"};}
      else{p.hp=Math.min(maxHp(),p.hp+2);banner={t:1.2,txt:"❤ +2 PV"};}
      beep(700,.15,"sine",.05);picks.splice(i,1);continue;
    }
    if(k.y>H+10)picks.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0)parts.splice(i,1);
  }
  if(state==="play"&&!queue.length&&!enemies.length)waveDone();
}

function waveDone(){
  state="shop";
  coins.forEach(c=>save.gold+=c.v);coins=[];
  if(wave>save.best)save.best=wave;
  const done=wave;wave++;
  p.hp=Math.min(maxHp(),p.hp+2);
  persist();
  shop("Vague "+done+" terminée !","Score : "+score,"Vague suivante ▶",()=>{hideOv();bullets=[];startWave();state="play";});
}
function gameOver(){
  state="over";
  if(wave>save.best)save.best=wave;
  persist();
  shop("Défaite 💥","Vague "+wave+" · Score "+score+" · Record : vague "+save.best,"Rejouer",initRun);
}

function shop(title,sub,btn,fn){
  let h="<h2>"+title+"</h2><p>"+sub+"</p><p class='g'>🪙 "+save.gold+"</p><div class='ups'>";
  UP.forEach(u=>{
    const lv=save[u.k],mx=lv>=u.max,c=cost(u);
    h+="<button class='up' data-k='"+u.k+"' "+((mx||save.gold<c)?"disabled":"")+"><b>"+u.n+"</b>niv. "+lv+"<span>"+(mx?"MAX":"🪙 "+c)+"</span></button>";
  });
  h+="</div><button class='main' id='go'>"+btn+"</button>";
  ov.innerHTML=h;ov.style.display="flex";
  ov.querySelectorAll(".up").forEach(b=>b.onclick=()=>{
    const u=UP.find(x=>x.k===b.dataset.k),c=cost(u);
    if(save.gold>=c&&save[u.k]<u.max){save.gold-=c;save[u.k]++;persist();beep(660,.1,"sine",.05);
      if(u.k==="hp")p.hp=Math.min(maxHp(),p.hp+1);
      shop(title,sub,btn,fn);}
  });
  document.getElementById("go").onclick=fn;
}
function menu(){
  ov.innerHTML="<h1>BASTION<br>BLITZ</h1><p>Glisse ton doigt pour déplacer ton château roulant.<br>Il tire tout seul : détruis les monstres, ramasse les pièces, améliore-toi !</p>"
    +"<button class='main' id='play'>▶ Jouer</button><button class='sec' id='shopb'>🛠 Améliorations</button>"
    +"<p style='opacity:.6'>Record : vague "+save.best+"</p>";
  ov.style.display="flex";
  document.getElementById("play").onclick=initRun;
  document.getElementById("shopb").onclick=()=>shop("Améliorations","","▶ Jouer",initRun);
}

/* ============ DESSIN ============ */
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function rrect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#86d45a");g.addColorStop(1,"#4a9a3a");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(210,180,120,.35)";ctx.fillRect(W/2-70,0,140,WALL);
  ctx.strokeStyle="rgba(40,100,30,.5)";ctx.lineWidth=2;
  grass.forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0]-3,a[1]-a[2]);ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0]+3,a[1]-a[2]);ctx.stroke();});
  // mur
  rrect(0,WALL,W,H-WALL,0,"#7d8499");
  ctx.fillStyle="#9aa1b8";
  for(let x=0;x<W;x+=36)ctx.fillRect(x+4,WALL-10,26,12);
  ctx.strokeStyle="#5f6579";ctx.lineWidth=1.5;
  for(let y=WALL+14;y<H;y+=16){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function drawPlayer(){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.hurt>0)ctx.globalAlpha=.5+.5*Math.sin(p.hurt*45);
  // canons
  const n=1+save.multi;
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*12;rrect(o-4,-56,8,26,3,"#4a4f5e");rrect(o-5,-58,10,6,2,"#2f3340");}
  // tour
  rrect(-22,-34,44,34,4,"#a5adc2");
  ctx.fillStyle="#a5adc2";for(let i=-1;i<=1;i++)ctx.fillRect(i*15-5,-42,10,10);
  ctx.strokeStyle="#6a7188";ctx.lineWidth=2;ctx.strokeRect(-22,-34,44,34);
  // héros
  circle(0,-20,11,"#ffcf8a");
  ctx.fillStyle="#3f6fd0";ctx.beginPath();ctx.arc(0,-22,12,Math.PI,0);ctx.fill();
  circle(-4,-19,1.8,"#222");circle(4,-19,1.8,"#222");
  // chariot
  rrect(-36,-2,72,26,6,"#8a5a2b");
  rrect(-36,-2,72,6,3,"#a97a45");
  [-22,22].forEach(x=>{circle(x,24,11,"#2e2626");circle(x,24,5,"#8d8d8d");});
  if(p.rapid>0){ctx.strokeStyle="rgba(255,230,80,.8)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-10,44,0,6.3);ctx.stroke();}
  ctx.restore();
}
function drawEnemy(e){
  const d=T[e.t];
  ctx.save();ctx.translate(e.x,e.y);
  const sq=1+.07*Math.sin(t*8+e.ph);ctx.scale(2-sq,sq);
  const col=e.hit>0?"#fff":d.c;
  const r=e.r;
  // cornes
  ctx.fillStyle=e.hit>0?"#fff":"#f2e8c9";
  ctx.beginPath();ctx.moveTo(-r*.8,-r*.4);ctx.lineTo(-r*.5,-r*1.3);ctx.lineTo(-r*.1,-r*.8);ctx.fill();
  ctx.beginPath();ctx.moveTo(r*.8,-r*.4);ctx.lineTo(r*.5,-r*1.3);ctx.lineTo(r*.1,-r*.8);ctx.fill();
  // corps
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,r,r*.92,0,0,6.3);ctx.fill();
  // yeux
  circle(-r*.35,-r*.15,r*.26,"#fff");circle(r*.35,-r*.15,r*.26,"#fff");
  circle(-r*.32,-r*.08,r*.12,"#222");circle(r*.32,-r*.08,r*.12,"#222");
  // bouche
  ctx.strokeStyle="#222";ctx.lineWidth=Math.max(1.5,r*.08);
  ctx.beginPath();ctx.arc(0,r*.3,r*.3,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.restore();
  if(e.max>5){
    const w=r*1.6;ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(e.x-w/2,e.y-r-14,w,5);
    ctx.fillStyle="#ff5a5a";ctx.fillRect(e.x-w/2,e.y-r-14,w*Math.max(0,e.hp/e.max),5);
  }
}
function drawHUD(){
  // PV
  rrect(10,10,110,14,7,"rgba(0,0,0,.45)");
  rrect(10,10,Math.max(0,110*p.hp/maxHp()),14,7,"#ff5a6a");
  ctx.fillStyle="#fff";ctx.font="bold 11px system-ui,sans-serif";ctx.textAlign="left";
  ctx.fillText("❤ "+Math.max(0,Math.ceil(p.hp))+"/"+maxHp(),16,21);
  ctx.fillText("🪙 "+save.gold,12,42);
  ctx.textAlign="center";ctx.font="bold 15px system-ui,sans-serif";
  ctx.fillText("Vague "+wave,W/2,22);
  ctx.font="12px system-ui,sans-serif";ctx.fillText("Score "+score,W/2,38);
  if(banner){
    ctx.globalAlpha=Math.min(1,banner.t*2);
    ctx.font="bold 30px system-ui,sans-serif";ctx.lineWidth=5;ctx.strokeStyle="#33220f";ctx.strokeText(banner.txt,W/2,H/2-60);
    ctx.fillStyle="#ffd75e";ctx.fillText(banner.txt,W/2,H/2-60);ctx.globalAlpha=1;
  }
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);
  drawBG();
  enemies.forEach(drawEnemy);
  coins.forEach(c=>{circle(c.x,c.y,6,"#c58a12");circle(c.x,c.y,4.5,"#ffd23f");circle(c.x-1,c.y-1,1.6,"#fff6c0");});
  picks.forEach(k=>{circle(k.x,k.y,12,k.k==="R"?"#ffd23f":"#ff5a6a");ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";ctx.textAlign="center";ctx.fillText(k.k==="R"?"⚡":"+",k.x,k.y+5);});
  bullets.forEach(b=>{circle(b.x,b.y,4,"#ffe680");circle(b.x,b.y,2,"#fff");});
  drawPlayer();
  parts.forEach(q=>{ctx.globalAlpha=Math.max(0,q.l*2);circle(q.x,q.y,3,q.c);});ctx.globalAlpha=1;
  ctx.restore();
  drawHUD();
}

/* ============ ENTRÉES ============ */
const keys={l:false,r:false};
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="q")keys.l=true;
  if(e.key==="ArrowRight"||e.key==="d")keys.r=true;
});
addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="q")keys.l=false;
  if(e.key==="ArrowRight"||e.key==="d")keys.r=false;
});
function ptr(e){
  if(state!=="play")return;
  const r=wrap.getBoundingClientRect();
  tx=(e.clientX-r.left)/r.width*W;
}
stage.addEventListener("pointerdown",ptr);
stage.addEventListener("pointermove",ptr);
document.addEventListener("touchmove",e=>{if(e.target.closest("#stage")&&state==="play")e.preventDefault();},{passive:false});

/* ============ BOUCLE ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  if(state==="play")update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();initAds();resize();menu();
requestAnimationFrame(frame);
</script>
</body>
</html>
